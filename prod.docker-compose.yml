services:
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: gunicorn auth_server.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      - DEBUG=False
      - AUTH_DATABASE_NAME=${AUTH_DATABASE_NAME}
      - AUTH_DATABASE_USER=${AUTH_DATABASE_USER}
      - AUTH_DATABASE_USER_PASSWORD=${AUTH_DATABASE_USER_PASSWORD}
      - AUTH_DATABASE_HOST=${AUTH_DATABASE_HOST}
      - AUTH_DATABASE_PORT=${AUTH_DATABASE_PORT}
    restart: always

# docker-compose -f prod.docker-compose.yml up auth-server