name: Build
run-name: Build - ${{ inputs.branch }} - ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'master'
      
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: 'production'
        options:
          - production
      

permissions: # Github to talk with ECR, Best practise to use OIDC rather than AWS access keys
  id-token: write
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      
      - name: Prepare docker tag for build
        shell: bash
        run: |
          BRANCH_NAME=${{ inputs.branch }}
          SAFE_BRANCH="${BRANCH_NAME//\//-}" # Replace slashes in branch name with dashes
          echo "SAFE_BRANCH=$SAFE_BRANCH" >> $GITHUB_ENV
          echo "IMAGE_TAG=${SAFE_BRANCH}-${GITHUB_SHA::12}" >> $GITHUB_ENV
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_GITHUB_ECR_PUSH_ROLE_ARN }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build Docker image
        run: |
          docker build -t ${{ vars.ECR_REPOSITORY_URI }}:${{ env.IMAGE_TAG }} .
      
      - name: Push Docker image to ECR
        run: |
          docker push ${{ vars.ECR_REPOSITORY_URI }}:${{ env.IMAGE_TAG }}
      
      - name: Show final image tag
        run: |
          echo "Built image tag: ${{ env.IMAGE_TAG }}"
          echo "ECR URI: ${{ vars.ECR_REPOSITORY_URI }}"




      

      